# Bellbird, configuración de fábrica
# Valores predeterminados. Este archivo se genera con:
#   uv run python -m guyrapu.core.config_predeterminada
# No editar a mano sin regenerar la otra copia: config_predeterminada.py

[voz]
# Motor de voz: sapi, onecore o elevenlabs. Voz vacía es la
# primera del sistema; se guarda por nombre. La voz principal y
# la secundaria se cambian en Preferencias > Voces. Con ElevenLabs,
# voz_respaldo es la voz de Windows que suena si falla o se pasa
# el límite de caracteres (elevenlabs_tope, 0 sin límite), y
# elevenlabs_solo_importantes reserva la nube para Super Chats,
# stickers, miembros, cofres, el dueño del canal y los moderadores.
motor = sapi
voz =
velocidad_voz = 50
volumen = 1.0
tono = 50
voz_respaldo =
voz_secundaria =
velocidad_secundaria = 50
volumen_secundaria = 1.0
voz_respaldo_secundaria =
elevenlabs_tope = 30000
elevenlabs_solo_importantes = false

[cola]
# Cola de lectura: con límite descarta los más antiguos si se llena.
estrategia = limite
tamanio_maximo = 15
umbral_solo_nombre = 0

[reconexion]
# Reconexión automática si se corta el chat.
reconectar = true
espera_entre_intentos = 15
max_intentos = 20

[lectura]
# Qué parte del mensaje se lee: nombre y mensaje, solo uno, etc.
# recientes elige quién lee los mensajes recientes: el lector de
# pantalla (lector) o la voz de la app (voz).
# Leer los mensajes recientes en cualquier programa con Ctrl+Mayús y un número.
formato_prefijo = nombre_mensaje
recientes = lector
atajos_globales = false

[filtros]
# Listas en minúsculas, separadas por comas. Vacías no filtran.
palabras_silenciadas =
usuarios_silenciados =

[texto]
# Limpieza del texto antes de leer y longitud máxima en caracteres.
limpiar_emojis = true
eliminar_urls = true
max_longitud_mensaje = 200

[atajos]
# Atajos por familia: Ctrl reproductor, Alt chat, Ctrl+Shift ventanas y Alt+Shift directo.
# F voz y Ctrl+Alt música. F9-F12 se guardan pero no se editan. Alt+F4 y F6 no se guardan.
rep_play = ctrl+p
rep_retro = ctrl+left
rep_avanz = ctrl+right
rep_directo = ctrl+end
rep_detener = ctrl+d
rep_mute = ctrl+m
rep_vol_menos = ctrl+down
rep_vol_mas = ctrl+up
descargas_abrir = ctrl+shift+d
pantalla_completa = ctrl+f
abrir_preferencias = ctrl+shift+p
abrir_historial = ctrl+shift+h
marcar_incidencia = alt+shift+i
abrir_restream = ctrl+shift+r
abrir_obs = ctrl+shift+o
mostrar_obs = alt+shift+o
copiar_enlace = alt+shift+e
obs_micro = alt+shift+m
obs_grabar = alt+shift+g
obs_pausar_grabacion = alt+shift+p
guardar_clip = alt+shift+r
avisos_sobrecarga = alt+shift+a
conectar = alt+shift+c
desconectar = alt+shift+d
enviar_chat = alt+enter
ir_lista = alt+shift+l
pausa = f5
detener_tts = f8
velocidad_menos = f9
velocidad_mas = f10
volumen_menos = f11
volumen_mas = f12
silenciar_lectura = f4
silenciar_sonidos = f7
anunciar_estado = f2
anunciar_autor = f3
describir_escena = ctrl+f2
consulta_rapida_ia = ctrl+shift+f2
musica_play = ctrl+alt+space
musica_siguiente = ctrl+alt+right
musica_anterior = ctrl+alt+left
musica_vol_mas = ctrl+alt+up
musica_vol_menos = ctrl+alt+down
musica_que_suena = ctrl+alt+t
musica_silenciar = ctrl+alt+m
musica_aleatorio = ctrl+alt+a
musica_repetir = ctrl+alt+r
musica_detener = ctrl+alt+d
musica_adelantar = ctrl+alt+shift+right
musica_retroceder = ctrl+alt+shift+left
musica_ventana = ctrl+shift+m
preguntar_ia = ctrl+shift+i
anunciar_encuadre = ctrl+f3
avisos_encuadre = ctrl+shift+f3

[ui]
# Interfaz: fuente del chat y opciones visibles.
# confirmar_salida pregunta antes de salir con chat o
# transmisión en curso; sonido_inicio suena al arrancar.
# idioma: windows o un código (es, en); se aplica al reiniciar.
tamanio_fuente_chat = 12
mostrar_total_superchats = true
autoplay_reproductor = true
reproductor_solo_audio = true
filtro_activo = todos
silenciar_sonidos = false
mostrar_botones_reproductor = true
cache_video_mb = 1024
mostrar_metadatos = true
confirmar_salida = true
sonido_inicio = true
idioma = windows

[sesion]
# Silenciar lectura al arrancar.
silenciar_lectura = false
version_atajos = 3

[tiktok]
# Usuario de TikTok. Los avisos de cada evento van en [eventos].
usuario =
agrupar_me_gusta = true
segundos_me_gusta = 10
agrupar_entradas = true
segundos_entradas = 10

[eventos]
# Modo de cada evento; se cambia en Preferencias > Lectura.
superchat = principal
miembro = principal
entrada = mostrar
me_gusta = mostrar
seguir = principal
compartir = principal
cofre = principal
encuesta = principal
meta = principal
batalla = principal

[programados]
activo = false

[diagnostico]
# Registro detallado para diagnosticar errores (requiere reiniciar).
registro_detallado = true

[overlay]
# Chat en el vídeo para transmitir por navegador (overlay web).
activo = false
puerto = 8730

[obs]
# Integración con OBS: nombre de la fuente de micrófono.
microfono =

[transmision]
# Transmisión: destino del directo y datos del directo de
# YouTube (se piden al transmitir y se recuerdan). La
# descripción guarda los saltos de línea como \n.
# La cámara de la escena actual se busca sola; camara_fuente
# la fija por nombre. camara_invertir invierte izquierda y
# derecha además del espejo que informa OBS.
# clips: 0 desactivados, 30 o 60 segundos de búfer.
# clips_chat: permitir !clip en el chat; clips_chat_espera: minutos
# entre clips pedidos desde el chat.
destino =
avisar_sobrecarga = true
titulo_estado_obs = false
grabar_al_transmitir = false
clips = 30
clips_chat = true
clips_chat_espera = 1
avisar_encuadre = false
camara_fuente =
camara_invertir = false
guia_timbre = normal
youtube_titulo =
youtube_descripcion =
youtube_privacidad = unlisted
youtube_latencia = normal
youtube_ninos = false
youtube_dvr = true
youtube_categoria =
youtube_etiquetas =
youtube_miniatura =
youtube_lista =
youtube_lista_titulo =

[estado]
# Componentes que anuncia F2. true se dice, false se omite.
# Se elige en Preferencias > Estado. El orden en que se dice es fijo.
estado = true
titulo = true
canal = true
espectadores = true
tiempo_directo = true
desfase_directo = true
mensajes_leidos = true
aportes = true
encuesta = true
batalla = true
meta = true
en_cola = false
voz = false
lectura_silenciada = true
overlay = true
programados = true
descartados = false
obs_transmision = false
obs_grabacion = false
obs_escena = false
musica = true
igualando = true
camara = true
cuota_youtube = false

[descargas]
# Gestor de descargas con yt-dlp. Formato: mp4 | webm | mp3 | m4a.
# Bitrate solo para audio. Carpeta portable junto al ejecutable.
formato = mp4
bitrate = 192
carpeta = Descargas
enumerar = false

[actualizaciones]
# Buscar actualizaciones de la app al iniciar y qué versiones mirar:
# estable (solo estables) o beta (estables y betas).
buscar_al_iniciar = true
canal = estable

[musica]
# Música local: carpeta de la biblioteca, orden y opciones de
# reproducción. La salida es el identificador de un dispositivo
# de audio de libVLC; vacía usa el predeterminado del sistema.
carpeta = Música
aleatorio = false
repetir = false
retomar = true
sonido_tema = false
decir =
decir_titulo = true
incluir_artista = false
decir_pausa = true
normalizar = true
preguntar_igualar = true
volumen = 50
cruce = 6
salida =
salida_nombre =
atajos_globales = false
mostrar_cola = false
mostrar_filtros = false
orden = coleccion
artista =

[ia]
# Preguntar a la IA sobre la imagen. La clave de cada proveedor no
# va acá: se guarda en el Administrador de credenciales de Windows.
# Pregunta vacía usa la de fábrica. Dirección solo para «Otro
# compatible con OpenAI». Tiempo de espera en segundos.
proveedor = gemini
modelo =
direccion =
pregunta =
largo = media
tiempo_espera = 60
solo_gratis = false
privacidad_aceptada = false
decir_analizando = true
